name: Build and attest public source snapshot

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version from VERSION
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify release input
        run: |
          set -eu
          test "$RELEASE_VERSION" = "$(tr -d '[:space:]' < VERSION)"
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
      - name: Run source release gates
        run: |
          dotnet test HitTheKit.sln --configuration Release
          ./scripts/check-nuget-vulnerabilities.sh
          bash tests/scripts/public-readiness-contract-tests.sh
      - name: Create rights-clean source snapshot
        run: |
          mkdir -p artifacts/source
          ./scripts/create-public-source-snapshot.sh "artifacts/source/HitTheKit-source-$RELEASE_VERSION.tar.gz"
          cd artifacts/source
          sha256sum "HitTheKit-source-$RELEASE_VERSION.tar.gz" > SHA256SUMS
      - name: Verify source snapshot checksum
        working-directory: artifacts/source
        run: sha256sum --check SHA256SUMS
      - name: Attest source provenance
        id: attest-source
        uses: actions/attest@v4
        with:
          subject-path: artifacts/source/HitTheKit-source-${{ inputs.version }}.tar.gz
      - name: Record source release evidence
        run: |
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'attestation-url=%s\n' '${{ steps.attest-source.outputs.attestation-url }}'
          } > artifacts/source/RELEASE-EVIDENCE.txt
      - name: Upload source release evidence
        uses: actions/upload-artifact@v7
        with:
          name: HitTheKit-source-${{ inputs.version }}
          path: artifacts/source
          if-no-files-found: error
          retention-days: 30
